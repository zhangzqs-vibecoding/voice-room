services:
  edge:
    image: voice-room-edge:ace519475c97a15eacb702d054231dc198530112
    build:
      context: .
      dockerfile: Dockerfile.edge
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      livekit:
        condition: service_healthy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - voice

  redis:
    image: redis:7.4-alpine
    command: redis-server --save '' --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - voice

  livekit:
    image: livekit/livekit-server:v1.9.11
    command:
      - --config
      - /etc/livekit.yaml
      - --keys
      - "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "443:443/udp"
      - "3478:3478/udp"
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"
    networks:
      - voice

  api:
    image: "ghcr.io/zhangzqs-vibecoding/voice-room-api:${VOICE_ROOM_IMAGE_TAG:?VOICE_ROOM_IMAGE_TAG is required}"
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: wss://livekit.vps-jp.zhangzqs.cn
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
      TRUSTED_PROXY_CIDRS: 172.29.0.0/24
      PORT: 3000
    depends_on:
      livekit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - voice

  web:
    image: "ghcr.io/zhangzqs-vibecoding/voice-room-web:${VOICE_ROOM_IMAGE_TAG:?VOICE_ROOM_IMAGE_TAG is required}"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - voice

networks:
  voice:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  caddy_data:
  caddy_config:
